<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Multi-Step Form with Social Media</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-8">
  <div x-data="multiStepForm" class="bg-white rounded-lg shadow-lg p-6 w-full max-w-lg">

    <!-- Step Navigation -->
    <div class="flex justify-between mb-6">
      <button @click="currentStep > 1 ? currentStep-- : null" :disabled="currentStep === 1"
        class="bg-gray-500 text-white px-4 py-2 rounded-md disabled:opacity-50"> Back </button>
      <button @click="currentStep < 4 ? currentStep++ : null" :disabled="currentStep === 4"
        class="bg-blue-500 text-white px-4 py-2 rounded-md disabled:opacity-50"> Next </button>
    </div>

    <form @submit.prevent="submitForm">
      <!-- Step 1 -->
      <div x-show="currentStep === 1">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Step 1: Personal Info</h2>
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" id="name" class="mt-1 p-2 border border-gray-300 rounded w-full" x-model="formData.name"
            placeholder="Enter your name" required>
        </div>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" class="mt-1 p-2 border border-gray-300 rounded w-full" x-model="formData.email"
            placeholder="Enter your email" required>
        </div>
      </div>

      <!-- Step 2 -->
      <div x-show="currentStep === 2">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Step 2: Address Info</h2>
        <div class="mb-4">
          <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
          <input type="text" id="address" class="mt-1 p-2 border border-gray-300 rounded w-full"
            x-model="formData.address" placeholder="Enter your address" required>
        </div>
        <div class="mb-4">
          <label for="city" class="block text-sm font-medium text-gray-700">City</label>
          <input type="text" id="city" class="mt-1 p-2 border border-gray-300 rounded w-full" x-model="formData.city"
            placeholder="Enter your city" required>
        </div>
      </div>

      <!-- Step 3: Social Media Links -->
      <div x-show="currentStep === 3">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Step 3: Social Media Links</h2>
        <div class="mb-4">
          <label for="facebook" class="block text-sm font-medium text-gray-700">Facebook</label>
          <input type="url" id="facebook" class="mt-1 p-2 border border-gray-300 rounded w-full"
            x-model="formData.facebook" placeholder="Enter your Facebook URL">
        </div>
        <div class="mb-4">
          <label for="twitter" class="block text-sm font-medium text-gray-700">Twitter</label>
          <input type="url" id="twitter" class="mt-1 p-2 border border-gray-300 rounded w-full"
            x-model="formData.twitter" placeholder="Enter your Twitter URL">
        </div>
        <div class="mb-4">
          <label for="instagram" class="block text-sm font-medium text-gray-700">Instagram</label>
          <input type="url" id="instagram" class="mt-1 p-2 border border-gray-300 rounded w-full"
            x-model="formData.instagram" placeholder="Enter your Instagram URL">
        </div>
      </div>

      <!-- Step 4: Confirmation -->
      <div x-show="currentStep === 4">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Step 4: Review & Confirm</h2>
        <p class="mb-4">Review your information:</p>
        <ul class="space-y-2">
          <li><strong>Name:</strong> <span x-text="formData.name"></span></li>
          <li><strong>Email:</strong> <span x-text="formData.email"></span></li>
          <li><strong>Address:</strong> <span x-text="formData.address"></span></li>
          <li><strong>City:</strong> <span x-text="formData.city"></span></li>
          <li><strong>Facebook:</strong> <span x-text="formData.facebook"></span></li>
          <li><strong>Twitter:</strong> <span x-text="formData.twitter"></span></li>
          <li><strong>Instagram:</strong> <span x-text="formData.instagram"></span></li>
        </ul>
      </div>
      <div class="mt-6" x-show="currentStep === 4">
        <button type="submit"
          class="w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 transition-colors">
          Submit
        </button>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('multiStepForm', () => ({
        currentStep: 1,
        formData: {
          name: '',
          email: '',
          address: '',
          city: '',
          facebook: '',
          twitter: '',
          instagram: ''
        },

        submitForm() {
          console.log("Form Submitted Successfully", this.formData);
        }


      }));
    });
  </script>
</body>

</html>

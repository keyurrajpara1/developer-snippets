<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown with Search</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div x-data="searchableDropdown" class="relative w-80">
    <label class="block mb-2 text-gray-700 font-medium">Select an Option</label>
    <!-- Selected Option -->
    <div @click="toggleDropdown"
      class="border border-gray-300 rounded-lg px-4 py-2 flex justify-between items-center cursor-pointer focus:ring focus:ring-blue-200">
      <span x-text="selected || 'Choose an option'"></span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 011.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd" />
      </svg>
    </div>

    <!-- Dropdown Options -->
    <div x-show="isOpen" @click.away="closeDropdown"
      class="absolute z-10 bg-white shadow-lg rounded-lg mt-2 w-full border border-gray-200">
      <!-- Search Input -->
      <div class="p-2">
        <input x-model="query" type="text" placeholder="Search..."
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200">
      </div>

      <!-- Options -->
      <ul>
        <template x-for="(option, index) in filteredOptions" :key="index">
          <li @click="selectOption(option)" class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-gray-800"
            x-text="option">
          </li>
        </template>
        <li x-show="filteredOptions.length === 0" class="px-4 py-2 text-gray-500 text-center">
          No options found.
        </li>
      </ul>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('searchableDropdown', () => ({
        isOpen: false,
        query: '',
        selected: null,
        options: [
          'Apple',
          'Banana',
          'Orange',
          'Grapes',
          'Pineapple',
          'Mango',
          'Strawberry',
          'Peach'
        ],
        get filteredOptions() {
          return this.options.filter(option => option.toLowerCase().includes(this.query.toLowerCase()))
        },
        toggleDropdown() {
          this.isOpen = !this.isOpen;
        },
        closeDropdown() {
          this.isOpen = false;
        },
        selectOption(option) {
          this.selected = option;
          this.query = '';
          this.closeDropdown();
        }

      }));
    });
  </script>

</body>

</html>

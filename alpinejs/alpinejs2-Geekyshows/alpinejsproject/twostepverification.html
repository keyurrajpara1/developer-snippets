<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Step Verification</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 h-screen flex items-center justify-center p-4">

  <div x-data="verificationForm" class="w-full max-w-md bg-white p-6 rounded-lg shadow-md">
    <div x-show="step === 1">
      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">Step 1: Enter your phone/email
      </h2>
      <div class="mb-4">
        <label for="phone" class="block text-gray-700 font-medium mb-2">Phone/Email</label>
        <input type="text" id="phone" x-model="phone"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your phone or email">
      </div>
      <div class="text-center">
        <button @click="sendCode"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors duration-200">
          Send Code
        </button>
      </div>
    </div>

    <!-- Verification Code Step -->
    <div x-show="step === 2">
      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">Step 2: Enter the verification
        code</h2>
      <div class="mb-4">
        <label for="code" class="block text-gray-700 font-medium mb-2">Verification Code</label>
        <input type="text" id="code" x-model="verificationCode"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter the code sent to you">
      </div>
      <div class="text-center">
        <button @click="submitCode"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors duration-200">
          Verify Code
        </button>
      </div>
    </div>

    <!-- Status Message -->
    <div class="mt-4 text-center text-gray-700" x-text="message"></div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('verificationForm', () => ({
        step: 1,
        phone: '',
        verificationCode: '',
        otp: '123456',
        message: '',

        sendCode() {
          this.step = 2
          this.message = 'A verification code has been sent to your phone/email.'
        },

        submitCode() {
          if (this.verificationCode === this.otp) {
            this.message = 'Verification successful! '
          } else {
            this.message = 'Invalid code. Please try again.';
          }
        }

      }));
    });

  </script>

</body>

</html>

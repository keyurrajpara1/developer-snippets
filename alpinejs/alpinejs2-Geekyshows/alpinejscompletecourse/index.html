  <script>
    function myfun() {
      console.log("My Function called");
    }
    function handleClick(e) {
      console.log(e);
    }

    function sayHello({ greeting, name }) {
      alert(greeting + ' ' + name + '!')
    }

    document.addEventListener('alpine:init', () => {
      Alpine.store('counter', {
        count: 0
      })
    })

    document.addEventListener('alpine:init', () => {
      Alpine.store('yellowMode', {
        on: false,
        toggle() {
          this.on = !this.on
        }
      })
    })

    document.addEventListener('alpine:init', () => {
      Alpine.store('greenMode', false)
    })

    document.addEventListener('alpine:init', () => {
      Alpine.data('dropdown', () => ({
        open: false,

        toggle() {
          this.open = !this.open
        }
      }))
    })

    document.addEventListener('alpine:init', () => {
      Alpine.bind('SomeButton', () => ({
        type: 'button',
        '@click'() {
          console.log("Button Clicked");
        },

      }))
    })

    function syncFun() {
      return 'Hello Sync!'
    }
    async function asyncFun() {
      return 'Hello Async!'
    }
  </script>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekyShows</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <style>
    .tabs-container {
      max-width: 600px;
      margin: 2rem auto;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .tabs-list {
      display: flex;
      list-style: none;
      padding: 0;
      margin: 0;
      border-bottom: 2px solid #e5e7eb;
    }

    .tab-button {
      padding: 0.75rem 1.5rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1rem;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .tab-button:hover {
      color: #4b5563;
    }

    .tab-button.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }

    .tab-panel {
      padding: 1.5rem;
      background-color: #ffffff;
      border-radius: 0 0 0.5rem 0.5rem;
    }
  </style>
</head>

<body>
  <div class="tabs-container" x-data="{ activeTab: 'tab1' }">
    <ul class="tabs-list" role="tablist">
      <li role="presentation">
        <button @click="activeTab = 'tab1'" class="tab-button" :class="{ 'active': activeTab === 'tab1' }" role="tab"
          aria-controls="panel1" :aria-selected="activeTab === 'tab1'">Tab 1</button>
      </li>
      <li role="presentation">
        <button @click="activeTab = 'tab2'" class="tab-button" :class="{ 'active': activeTab === 'tab2' }" role="tab"
          aria-controls="panel2" :aria-selected="activeTab === 'tab2'">Tab 2</button>
      </li>
      <li role="presentation">
        <button @click="activeTab = 'tab3'" class="tab-button" :class="{ 'active': activeTab === 'tab3' }" role="tab"
          aria-controls="panel3" :aria-selected="activeTab === 'tab3'">Tab 3</button>
      </li>
    </ul>

    <div class="tab-panel" role="tabpanel" id="panel1" x-show="activeTab === 'tab1'">
      <h3>Content for Tab 1</h3>
      <p>This is the content for the first tab. You can add any HTML content here.</p>
    </div>

    <div class="tab-panel" role="tabpanel" id="panel2" x-show="activeTab === 'tab2'">
      <h3>Content for Tab 2</h3>
      <p>This is the content for the second tab. Each tab can have different content.</p>
    </div>

    <div class="tab-panel" role="tabpanel" id="panel3" x-show="activeTab === 'tab3'">
      <h3>Content for Tab 3</h3>
      <p>This is the content for the third tab. The tabs are fully accessible and responsive.</p>
    </div>
  </div>
</body>

</html>

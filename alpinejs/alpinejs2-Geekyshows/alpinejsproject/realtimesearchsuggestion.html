<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Search Suggestions</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div x-data="searchSuggestions" class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Real-Time Search Suggestions</h1>

    <!-- Search Input -->
    <div class="relative">
      <input type="text" placeholder="Search..." x-model="query" @input="fetchSuggestion"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring focus:ring-blue-200">

      <!-- Suggestions Dropdown -->
      <ul x-show="suggestions.length > 0" @click.away="clearSuggestions"
        class="absolute z-10 bg-white shadow-lg rounded-lg w-full mt-2 border border-gray-200 overflow-hidden">
        <template x-for="(suggestion, index) in suggestions" :key="index">
          <li @click="selectSuggestion(suggestion)" class="px-4 py-2 hover:bg-gray-100 cursor-pointer text-gray-700"
            x-text="suggestion"></li>
        </template>
      </ul>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('searchSuggestions', () => ({
        query: '',
        suggestions: [],
        items: [
          'Apple',
          'Banana',
          'Orange',
          'Grapes',
          'Watermelon',
          'Pineapple',
          'Mango',
          'Strawberry'
        ],

        fetchSuggestion() {
          if (this.query.trim() === '') {
            this.suggestions = [];
            return;
          }
          this.suggestions = this.items.filter(item => item.toLowerCase().includes(this.query.toLowerCase()))
        },
        selectSuggestion(suggestion) {
          this.query = suggestion
          this.clearSuggestions()
        },
        clearSuggestions() {
          this.suggestions = [];
        }

      }));
    });
  </script>

</body>

</html>

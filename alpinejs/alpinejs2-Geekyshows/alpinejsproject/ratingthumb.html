<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbs Up/Down Rating</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div x-data="thumbsRating" class="bg-white shadow-lg rounded-lg p-6 text-center w-80">
    <h1 class="text-xl font-bold text-gray-800 mb-4">Rate this!</h1>

    <div class="flex justify-center items-center space-x-4">
      <!-- Thumbs Up -->
      <button @click="rate('up')" :class="{'text-green-500': rating === 'up'}"
        class="text-gray-500 hover:text-green-500 text-3xl transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
          <path
            d="M2 10h4v10H2V10zm20.2-1.8c-.4-.6-1.1-1-1.8-1H14V5.3c0-1.1-.6-2.1-1.6-2.6l-.9-.5c-.5-.3-1.1-.2-1.5.1-.5.3-.8.8-.8 1.4L9 5.5v.2L8.5 8.5C8.3 9.4 7.6 10 6.7 10H6v10h1.7c.7 0 1.3.3 1.7.8l5.2 6.2c.3.4.7.6 1.1.6.2 0 .4-.1.6-.2.5-.3.8-.8.8-1.4l-.1-2.3c0-.6.2-1.3.5-1.8l1.6-2.3h4.4c1.1 0 2-.9 2-2V10c0-.4-.1-.8-.3-1.2z" />
        </svg>
      </button>

      <!-- Thumbs Down -->
      <button @click="rate('down')" :class="{'text-red-500': rating === 'down'}"
        class="text-gray-500 hover:text-red-500 text-3xl transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" width="24" height="24">
          <path
            d="M2 4h4v10H2V4zm20.2 9.8c-.4.6-1.1 1-1.8 1H14v3.2c0 1.1-.6 2.1-1.6 2.6l-.9.5c-.5.3-1.1.2-1.5-.1-.5-.3-.8-.8-.8-1.4L9 18.5v-.2l-.5-2.8C8.3 14.6 7.6 14 6.7 14H6V4h1.7c.7 0 1.3-.3 1.7-.8l5.2-6.2c.3-.4.7-.6 1.1-.6.2 0 .4.1.6.2.5.3.8.8.8 1.4l-.1 2.3c0 .6.2 1.3.5 1.8l1.6 2.3h4.4c1.1 0 2 .9 2 2v4c0 .4-.1.8-.3 1.2z" />
        </svg>
      </button>
    </div>

    <!-- Selected Rating -->
    <p class="mt-4 text-gray-700" x-text="feedbackMessage"></p>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('thumbsRating', () => ({

        rating: null,
        rate(option) {
          this.rating = option;
        },
        get feedbackMessage() {
          if (this.rating === 'up') {
            return 'You gave a thumbs up! 👍';
          } else if (this.rating === 'down') {
            return 'You gave a thumbs down. 👎';
          }
          return 'Select a rating above.';
        }

      }));
    });
  </script>

</body>

</html>

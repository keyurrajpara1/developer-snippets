<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekyShows</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    .carousel-container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
    }

    .main-image {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 8px;
    }

    .thumbnails {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      overflow-x: auto;
      padding: 8px 0;
    }

    .thumbnail {
      width: 80px;
      height: 60px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 4px;
      transition: opacity 0.2s;
    }

    .thumbnail:hover {
      opacity: 0.8;
    }

    .thumbnail.active {
      border: 2px solid #3b82f6;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 16px;
      cursor: pointer;
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .nav-button:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .prev {
      left: 16px;
    }

    .next {
      right: 16px;
    }

    .fade-enter {
      opacity: 0;
    }

    .fade-enter-active {
      opacity: 1;
      transition: opacity 300ms ease-in;
    }

    .fade-leave {
      opacity: 1;
    }

    .fade-leave-active {
      opacity: 0;
      transition: opacity 300ms ease-out;
    }
  </style>
</head>

<body>
  <div class="carousel-container" x-data="carousel">

    <img :src="images[currentIndex]" class="main-image" alt="Gallery image"
      x-transition:enter="fade-enter fade-enter-active" x-transition:leave="fade-leave fade-leave-active">

    <button class="nav-button prev" @click="prevImage">←</button>
    <button class="nav-button next" @click="nextImage">→</button>

    <div class="thumbnails">
      <template x-for="(image, index) in images" :key="index">
        <img :src="image" :alt="'Thumbnail ' + (index + 1)" class="thumbnail"
          :class="{ 'active': currentIndex === index }" @click="goToImage(index)">
      </template>
    </div>



  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('carousel', () => ({
        currentIndex: 0,
        images: [
          'images/img1.jpg',
          'images/img2.jpg',
          'images/img3.jpg',
          'images/img4.jpg',
          'images/img5.jpg'
        ],
        nextImage() {
          this.currentIndex = (this.currentIndex + 1) % this.images.length;
        },
        prevImage() {
          this.currentIndex = (this.currentIndex - 1 + this.images.length) % this.images.length;
        },
        goToImage(index) {
          this.currentIndex = index;
        }
      }));
    })
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekyShows</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    .toggle-wrapper {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #3b82f6;
    }

    input:checked+.slider:before {
      transform: translateX(26px);
    }

    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #374151;
    }
  </style>
</head>

<body>
  <div class="toggle-wrapper" x-data="{ isOn: false }">
    <label class="toggle">
      <input type="checkbox" x-model="isOn">
      <span class="slider"></span>
    </label>

    <div class="status">
      Status: <span x-text="isOn ? 'ON' : 'OFF'"></span>
    </div>
  </div>
</body>

</html>

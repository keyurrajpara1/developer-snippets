<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

  <div x-data="shoppingCart" class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Shopping Cart</h2>

    <!-- Display Products -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
      <template x-for="(product, index) in products" :key="product.id">
        <div class="bg-white rounded-lg shadow p-4">
          <img :src="product.image" alt="Product Image" class="w-full h-48 object-cover rounded-lg mb-4">
          <h3 class="text-xl font-semibold text-gray-800 mb-2" x-text="product.name"></h3>
          <p class="text-lg text-gray-600 mb-4" x-text="`Rs. ${product.price.toFixed(2)}`"></p>
          <button @click="addToCart(product)"
            class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">
            Add to Cart
          </button>
        </div>
      </template>

    </div>

    <!-- Cart Items -->
    <div class="space-y-4 mb-6">
      <template x-for="(item, index) in cartItems" :key="index">
        <div class="flex justify-between items-center border-b pb-4">
          <div class="flex items-center">
            <img :src="item.image" alt="Product Image" class="w-16 h-16 object-cover rounded-lg mr-4">
            <span class="text-gray-800 font-medium" x-text="item.name"></span>
          </div>
          <div class="flex items-center space-x-2">
            <button @click="adjustQuantity(index, -1)" class="px-3 py-1 bg-gray-200 rounded-full hover:bg-gray-300">
              -
            </button>
            <span class="text-lg font-semibold text-gray-700" x-text="item.quantity"></span>
            <button @click="adjustQuantity(index, 1)" class="px-3 py-1 bg-gray-200 rounded-full hover:bg-gray-300">
              +
            </button>
          </div>
          <button @click="removeFromCart(index)" class="text-red-500 hover:text-red-700 transition-colors">
            Remove</button>
          <div class="text-lg font-semibold text-gray-800">
            <span x-text="`Rs. ${(item.price * item.quantity).toFixed(2)}`"></span>
          </div>

        </div>
      </template>

    </div>

    <!-- Total Price -->
    <div class="flex justify-between items-center mb-6">
      <span class="text-lg font-medium text-gray-800">Total Price:</span>
      <span class="text-2xl font-semibold text-gray-800" x-text="`Rs. ${totalPrice().toFixed(2)}`"></span>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('shoppingCart', () => ({
        cartItems: [],
        products: [
          {
            id: 1,
            name: 'Wireless Headphones',
            price: 10.00,
            image: 'images/img1.jpg',
          },
          {
            id: 2,
            name: 'Smart Watch',
            price: 199.99,
            image: 'images/img2.jpg',
          },
          {
            id: 3,
            name: 'Bluetooth Speaker',
            price: 79.99,
            image: 'images/img3.jpg',
          }
        ],

        addToCart(product) {
          const existingItem = this.cartItems.find(item => item.id === product.id);
          if (existingItem) {
            existingItem.quantity++;
          } else {
            this.cartItems.push({ ...product, quantity: 1 })
          }
        },

        removeFromCart(index) {
          this.cartItems.splice(index, 1);
        },

        adjustQuantity(index, adjustedValue) {
          if (this.cartItems[index].quantity + adjustedValue > 0) {
            this.cartItems[index].quantity += adjustedValue;
          }
        },

        totalPrice() {
          return this.cartItems.reduce((total, item) => total + item.price * item.quantity, 0)
        }
      }));
    });
  </script>
</body>

</html>

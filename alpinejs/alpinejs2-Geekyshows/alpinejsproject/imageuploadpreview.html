<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Upload Preview</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div x-data="fileUploadPreview" class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Image Upload Preview</h1>

    <!-- Image Input -->
    <div>
      <label for="fileInput" class="block mb-2 text-gray-600 font-medium">Upload Image:</label>
      <input @change="handleImageUpload" id="fileInput" type="file" accept="image/*"
        class="block w-full text-gray-800 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:ring focus:ring-blue-200">
    </div>

    <!-- Preview Section -->
    <div x-show="fileData" class="mt-4">
      <h2 class="text-lg font-semibold text-gray-700 mb-2">Preview:</h2>
      <img :src="fileData" alt="Image Preview" class="rounded-lg border border-gray-300 w-full h-48 object-cover">
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('fileUploadPreview', () => ({
        fileData: null,
        handleImageUpload(event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              this.fileData = e.target.result;
            };
            reader.readAsDataURL(file);
          } else {
            this.fileData = null;
          }
        }
      }));
    });
  </script>

</body>

</html>

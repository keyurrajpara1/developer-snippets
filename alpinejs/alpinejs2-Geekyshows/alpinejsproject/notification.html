<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekyShows</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="text-center" x-data="notificationData">

    <!-- Notification -->
    <div x-show="showNotification" @click="showNotification = false" :class="{
      'bg-green-500': type === 'success',
      'bg-red-500': type === 'error',
      'bg-yellow-500': type === 'warning',
      'bg-blue-500': type === 'info'
    }"
      class="fixed top-5 right-5 text-white  px-5 py-3 rounded-lg shadow-lg flex items-center gap-3 transform transition-transform duration-300"
      x-transition:enter="translate-x-full" x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0" x-transition:leave="translate-x-0" x-transition:leave-start="translate-x-0"
      x-transition:leave-end="translate-x-full">
      <span x-text="message" class="text-sm font-semibold"></span>
    </div>


    <div class="space-x-2">
      <button class="bg-green-500 text-white px-4 py-2 rounded-lg font-semibold"
        @click="notify('success', 'Registration completed successfully!')"> Success </button>

      <button class="bg-red-500 text-white px-4 py-2 rounded-lg font-semibold"
        @click="notify('error', 'An error occurred. Please try again.')">Error </button>

      <button class="bg-yellow-500 text-white px-4 py-2 rounded-lg font-semibold"
        @click="notify('warning', 'Warning: Please save your changes.')"> Warning </button>

      <button class="bg-blue-500 text-white px-4 py-2 rounded-lg font-semibold"
        @click="notify('info', 'System update available.')"> Info </button>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('notificationData', () => ({
        showNotification: false,
        message: '',
        type: '',
        notify(type, msg) {
          this.showNotification = true
          this.type = type;
          this.message = msg;
          setTimeout(() => this.showNotification = false, 3000)
        }

      }));
    });

  </script>
</body>

</html>

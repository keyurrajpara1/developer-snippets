<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekyShows</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    .carousel-container {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 400px;
      border-radius: 8px;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .carousel-nav {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .nav-dot.active {
      background-color: white;
    }

    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.3);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      transition: background-color 0.3s ease;
    }

    .carousel-button:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }
  </style>
</head>

<body>
  <div class="carousel-container" x-data="carousel">
    <div class="carousel">
      <div class="slide" :class="{ 'active': currentSlide === 0 }">
        <img src=" images/img1.jpg" alt="Slide 0" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <div class="slide" :class="{ 'active': currentSlide === 1 }">
        <img src="images/img2.jpg" alt="Slide 1" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <div class="slide" :class="{ 'active': currentSlide === 2 }">
        <img src="images/img3.jpg" alt="Slide 2" style="width: 100%; height: 100%; object-fit: cover;">
      </div>

      <button class="carousel-button prev" @click="prev">❮</button>
      <button class="carousel-button next" @click="next">❯</button>

      <div class="carousel-nav">
        <template x-for="(slide, index) in slides" :key="index">
          <div class="nav-dot" :class="{'active': currentSlide === index}" @click="currentSlide = index"></div>
        </template>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('carousel', () => ({
        currentSlide: 0,
        slides: [0, 1, 2],
        next() {
          this.currentSlide = (this.currentSlide + 1) % this.slides.length;
        },
        prev() {
          this.currentSlide = (this.currentSlide - 1 + this.slides.length) % this.slides.length;
        },
        init() {
          setInterval(() => this.next(), 5000);
        }
      }));
    });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Filter</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-4">
  <div x-data="productFilter" class="container mx-auto">
    <h1 class="text-2xl font-bold text-center mb-4">Product Filter</h1>

    <!-- Filter Section -->
    <div class="mb-4">
      <h2 class="text-lg font-medium mb-2">Filter by Categories</h2>
      <div class="flex flex-wrap gap-2">
        <template x-for="category in categories" :key="category">
          <label class="flex items-center space-x-2">
            <input type="checkbox" :value="category" x-model="selectedCategories" class="form-checkbox text-blue-500">
            <span x-text="category"></span>
          </label>
        </template>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <template x-for="product in filteredProducts" :key="product.id">
        <div class="bg-white rounded shadow p-4">
          <img :src="product.image" alt="" class="w-full h-40 object-cover mb-2">
          <h2 class="text-lg font-bold" x-text="product.title"></h2>
          <p class="text-gray-600" x-text="'$' + product.price"></p>
          <p class="text-sm text-gray-500" x-text="product.category"></p>
        </div>
      </template>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('productFilter', () => ({
        products: [],
        categories: [],
        selectedCategories: [],

        get filteredProducts() {
          if (this.selectedCategories.length === 0) {
            return this.products;
          }
          return this.products.filter(product =>
            this.selectedCategories.includes(product.category)
          );
        },

        async fetchProducts() {
          const response = await fetch('https://fakestoreapi.com/products');
          this.products = await response.json();
          this.categories = [...new Set(this.products.map(product => product.category))];
        },

        init() {
          this.fetchProducts();
        }

      }));
    });

  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload with Overlay</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- File Upload Component -->
  <div x-data="fileUpload" class="w-full max-w-md p-4 bg-white shadow rounded-lg">
    <!-- File Input -->
    <div>
      <label for="fileInput" class="block text-gray-700 font-medium mb-2">
        Upload a File
      </label>
      <input type="file" id="fileInput" @change="startUpload"
        class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <!-- Uploading Overlay -->
    <div x-show="isUploading" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
      x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-300"
      x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
      <div class="text-white text-xl font-semibold">
        Uploading...
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('fileUpload', () => ({
        isUploading: false,
        async startUpload(event) {
          this.isUploading = true;
          // Simulate upload delay
          await simulateUpload(3000);
          this.isUploading = false;
          alert("File uploaded successfully!");
        },
      }));
    });

    // Simulating upload time (you can remove this in production)
    const simulateUpload = (time = 3000) => {
      return new Promise((resolve) => setTimeout(resolve, time));
    };
  </script>

</body>

</html>
